<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>BandeJA Downloader</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      min-width: 240px;
      padding: 12px 16px;
      background: #f8f9fa;
      color: #333;
    }
    h3 { margin: 0 0 10px; font-size: 14px; color: #087021; }
    .stat { font-size: 13px; margin: 4px 0; }
    .label { color: #666; }
    .val   { font-weight: bold; }
    .ok    { color: #087021; }
    .error { color: #c0392b; }
    .en-curso { color: #e67e22; }
    #estado-servidor {
      font-size: 11px;
      margin-top: 10px;
      padding: 4px 8px;
      border-radius: 4px;
      text-align: center;
    }
    .conectado    { background: #d4edda; color: #155724; }
    .desconectado { background: #f8d7da; color: #721c24; }
    #zona-csv {
      margin-top: 12px;
      border-top: 1px solid #dee2e6;
      padding-top: 10px;
    }
    #btn-csv {
      width: 100%;
      padding: 6px;
      background: #087021;
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 12px;
      cursor: pointer;
    }
    #btn-csv:hover { background: #065a1a; }
    #csv-feedback {
      font-size: 11px;
      margin-top: 5px;
      text-align: center;
      min-height: 14px;
      color: #555;
    }
    #zona-destino {
      margin-top: 10px;
      border-top: 1px solid #dee2e6;
      padding-top: 8px;
    }
    #btn-pick-dir {
      width: 100%;
      padding: 6px;
      background: #6c757d;
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 12px;
      cursor: pointer;
    }
    #btn-pick-dir:hover { background: #545b62; }
    #btn-pausa { width:100%; padding:6px; margin-top:6px; border:none; border-radius:4px; font-size:12px; cursor:pointer; }
    #btn-pausa.pausado    { background: #e67e22; color: white; }
    #btn-pausa.reanudando { background: #087021; color: white; }
    #destino-path {
      font-size: 10px;
      color: #555;
      margin-top: 4px;
      word-break: break-all;
      min-height: 13px;
    }
  </style>
</head>
<body>
  <h3>BandeJA Downloader</h3>
  <div class="stat"><span class="label">Total: </span><span class="val" id="total">—</span></div>
  <div class="stat"><span class="label">Pendiente: </span><span class="val" id="pendiente">—</span></div>
  <div class="stat"><span class="label">En curso: </span><span class="val en-curso" id="en_curso">—</span></div>
  <div class="stat"><span class="label">Completados: </span><span class="val ok" id="ok">—</span></div>
  <div class="stat"><span class="label">Errores: </span><span class="val error" id="error">—</span></div>
  <div id="estado-servidor" class="desconectado">Servidor no disponible</div>

  <div id="zona-csv">
    <input type="file" id="input-csv" accept=".csv" style="display:none">
    <button id="btn-csv">Cargar CSV de BandeJA</button>
    <button id="btn-pausa" class="reanudando">⏸ Pausar</button>
    <button id="btn-export" style="width:100%;padding:6px;margin-top:6px;background:#495057;color:white;border:none;border-radius:4px;font-size:12px;cursor:pointer;">Descargar resultados CSV</button>
    <div id="csv-feedback"></div>
  </div>

  <div id="zona-destino">
    <button id="btn-pick-dir">Seleccionar carpeta destino…</button>
    <div id="destino-path">Sin carpeta configurada</div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
