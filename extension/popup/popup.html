<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>BandeJA Downloader</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      min-width: 240px;
      padding: 12px 16px;
      background: #f8f9fa;
      color: #333;
    }
    h3 { margin: 0 0 10px; font-size: 14px; color: #087021; }
    .stat { font-size: 13px; margin: 4px 0; }
    .label { color: #666; }
    .val   { font-weight: bold; }
    .ok    { color: #087021; }
    .error { color: #c0392b; }
    .en-curso { color: #e67e22; }
    #estado-servidor {
      font-size: 11px;
      margin-top: 10px;
      padding: 4px 8px;
      border-radius: 4px;
      text-align: center;
    }
    .conectado    { background: #d4edda; color: #155724; }
    .desconectado { background: #f8d7da; color: #721c24; }
  </style>
</head>
<body>
  <h3>BandeJA Downloader</h3>
  <div class="stat"><span class="label">Total: </span><span class="val" id="total">—</span></div>
  <div class="stat"><span class="label">Pendiente: </span><span class="val" id="pendiente">—</span></div>
  <div class="stat"><span class="label">En curso: </span><span class="val en-curso" id="en_curso">—</span></div>
  <div class="stat"><span class="label">Completados: </span><span class="val ok" id="ok">—</span></div>
  <div class="stat"><span class="label">Errores: </span><span class="val error" id="error">—</span></div>
  <div id="estado-servidor" class="desconectado">Servidor no disponible</div>
  <script src="popup.js"></script>
</body>
</html>
